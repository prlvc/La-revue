<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Revue</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#121014">
<meta name="apple-mobile-web-app-title" content="La Revue">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --g1:#3b5bff; --g2:#a24bff; --g3:#ff4fa3;
  --grad:linear-gradient(90deg,var(--g1),var(--g2) 55%,var(--g3));
  --red:var(--g3); --blue:var(--g1); --yellow:#ffc94d; --lime:var(--g2);
  --lv-rouge:#ff3b4e; --lv-orange:#ff9a1f; --lv-vert:#22c37a;
  --ease:cubic-bezier(.2,.8,.2,1); --r:22px;
}
html[data-theme="dark"]{
  --bg:#121014; --card:#1c1920; --card2:#27232c; --ink:#f4f1ea; --muted:#9c97a3; --rule:#2c2830; --chip:#221e26;
  --grid:rgba(162,75,255,.55); --shadow:none;
  --c1:#a24bff; --c2:#3b5bff; --c3:#ff4fa3; --c4:#d9ccff; --c5:#ffd0e6; --c6:#cdd6ff; --c7:#f4f1ea;
}
html[data-theme="light"]{
  --bg:#f4f1ea; --card:#fbf9f4; --card2:#ebe6dc; --ink:#141216; --muted:#6c6672; --rule:#d8d1c4; --chip:#e6e0d4;
  --grid:rgba(59,91,255,.35); --shadow:0 1px 2px rgba(40,20,60,.06);
  --c1:#a24bff; --c2:#3b5bff; --c3:#ff4fa3; --c4:#d9ccff; --c5:#ffd0e6; --c6:#cdd6ff; --c7:#141216;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:17px;line-height:1.6;
  transition:background .45s var(--ease),color .45s var(--ease);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font-family:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.lbl{font:600 11.5px "Inter Tight",sans-serif;text-transform:uppercase;letter-spacing:.12em}

/* ---------- ACCUEIL ---------- */
.hero{position:relative;overflow:hidden;padding:18px 0 0}
.hero .wrap{position:relative;z-index:3}
.topbar{display:flex;justify-content:space-between;align-items:center}
.brand{font:700 15px "Inter Tight",sans-serif;letter-spacing:-.01em}
.tools{display:flex;gap:8px}
.ibtn{appearance:none;border:1px solid var(--rule);background:var(--chip);color:var(--ink);width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;transition:transform .25s var(--ease),background .4s}
.ibtn:active{transform:scale(.88) rotate(-12deg)}
.ibtn svg{width:19px;height:19px}
.shapes{position:absolute;left:-40px;top:56px;width:440px;max-width:95vw;height:200px;z-index:1}
.shapes .half{position:absolute;top:0;width:130px;height:200px;border-radius:0 100px 100px 0;
  background:linear-gradient(180deg,var(--g3) 0%,var(--g2) 45%,transparent 100%);transform:translateX(-60px);opacity:0;animation:slideIn .9s var(--ease) forwards}
.shapes .half:nth-child(1){left:0;animation-delay:.05s}.shapes .half:nth-child(2){left:60px;animation-delay:.15s}
.shapes .half:nth-child(3){left:120px;animation-delay:.25s}.shapes .half:nth-child(4){left:180px;animation-delay:.35s}
@keyframes slideIn{to{transform:none;opacity:.95}}
.flower{position:absolute;left:160px;top:130px;width:140px;height:140px;z-index:2;animation:spin 60s linear infinite, popf .9s var(--ease) .4s both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popf{from{scale:.3;opacity:0}to{scale:1;opacity:1}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.hero-bottom{position:relative;display:flex;justify-content:space-between;align-items:flex-end;margin-top:200px;gap:12px}
.dateblock .d{font:800 clamp(40px,10vw,64px)/.9 "Inter Tight",sans-serif;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.dateblock .h{font:800 clamp(20px,4.6vw,28px)/1 "Inter Tight",sans-serif;letter-spacing:-.04em;margin-top:6px}
.dateblock .t{font:300 13px/1.3 "Inter Tight",sans-serif;margin-top:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.title{position:relative;text-align:right}
.title .l{display:block;font:900 clamp(70px,20vw,150px)/.8 "Inter Tight",sans-serif;letter-spacing:-.07em;position:relative;z-index:2;overflow:hidden;padding-bottom:.04em}
.title .l span{display:inline-block;transform:translateY(105%);animation:rise .9s var(--ease) forwards}
.title .l:nth-child(4) span{animation-delay:.12s}.title .l:nth-child(5) span{animation-delay:.24s}
.title .l:last-child span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes rise{to{transform:none}}
.ellipse{position:absolute;z-index:1;right:-60px;height:60px;border-radius:50%;background:linear-gradient(90deg,transparent,var(--g2) 40%,var(--g3));opacity:.8}
.ellipse.e1{width:260px;bottom:120px}.ellipse.e2{width:330px;bottom:30px;height:76px}
.gridfloor{position:absolute;left:-30%;right:-30%;top:330px;height:170px;z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:56px 34px;transform:perspective(320px) rotateX(58deg);transform-origin:bottom;
  mask-image:linear-gradient(transparent,#000 60%);-webkit-mask-image:linear-gradient(transparent,#000 60%);animation:floor 6s linear infinite}
@keyframes floor{to{background-position:0 34px}}
/* petites cartes de jeu sous le titre */
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0 4px}
.mini{appearance:none;border:0;text-align:left;border-radius:18px;padding:10px 11px 9px;cursor:pointer;color:#111;font:inherit;
  opacity:0;transform:translateY(16px) rotate(-1.5deg);animation:miniIn .6s var(--ease) forwards;animation-delay:calc(.5s + var(--i,0)*.07s);transition:transform .2s var(--ease)}
.mini:active{transform:scale(.94)}
@keyframes miniIn{to{opacity:1;transform:none}}
.mini b{display:block;font:800 26px/1 "Inter Tight",sans-serif;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.mini span{display:flex;align-items:center;gap:5px;font:600 11px "Inter Tight",sans-serif;margin-top:6px;opacity:.8;white-space:nowrap}
.mini.m1{background:var(--c4)}.mini.m2{background:var(--c5)}.mini.m3{background:var(--c6)}.mini.m4{background:var(--grad);color:#fff}
.hprog{margin-top:10px;height:6px;border-radius:999px;background:var(--chip);overflow:hidden}
.hprog i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .7s var(--ease)}
.hprogt{font:600 12px "Inter Tight",sans-serif;color:var(--muted);margin:6px 0 0}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.lbl{font:600 11.5px "Inter Tight",sans-serif;text-transform:uppercase;letter-spacing:.12em}

/* ---------- NAVIGATION ---------- */
.sticky{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background .45s;margin-top:18px}
.navrow{display:flex;align-items:center;gap:8px;padding:10px 0 8px}
.tabs{position:relative;flex:1;display:grid;grid-template-columns:repeat(2,1fr);background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.tabs button{position:relative;z-index:2;appearance:none;border:0;background:none;color:var(--muted);
  font:700 15px "Inter Tight",sans-serif;letter-spacing:-.01em;padding:11px 4px;border-radius:999px;cursor:pointer;transition:color .35s var(--ease);white-space:nowrap}
.tabs button[aria-selected="true"]{color:#fff}
.tabs .ind{position:absolute;z-index:1;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/2);border-radius:999px;background:var(--grad);box-shadow:0 6px 20px rgba(162,75,255,.35);
  transition:transform .5s var(--ease),opacity .3s}
.tabs.off .ind{opacity:0}
.side{display:flex;gap:2px;flex:none}
.side button{appearance:none;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;
  font:600 12.5px "Inter Tight",sans-serif;padding:8px 8px;border-radius:999px;transition:color .3s,border-color .3s}
.side button[aria-selected="true"]{color:var(--ink);border-color:var(--rule)}
.bdg{display:inline-block;min-width:17px;height:17px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--g3);color:#fff;font:800 10.5px/17px "Inter Tight",sans-serif;vertical-align:2px}
.bdg[hidden]{display:none}
.picker{display:flex;gap:6px;align-items:center;padding-bottom:8px;overflow-x:auto;scrollbar-width:none}
.picker::-webkit-scrollbar{display:none}
.picker select{font:600 14px "Inter Tight",sans-serif;color:var(--ink);background:var(--card);border:0;border-radius:999px;padding:9px 14px;flex:none;-webkit-appearance:none;appearance:none}
.slot{flex:none;appearance:none;border:0;background:var(--card);color:var(--ink);font:700 14px "Inter Tight",sans-serif;border-radius:999px;padding:9px 14px;cursor:pointer;
  transition:transform .2s var(--ease),background .3s,color .3s}
.slot:active{transform:scale(.92)}
.slot[aria-pressed="true"]{background:var(--grad);color:#fff}
.slot:disabled{opacity:.3;cursor:default}
.toc{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;font:500 13px "Inter Tight",sans-serif;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;border:1px solid var(--rule);transition:all .3s}
.toc a.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}
body.onfil .picker{display:none}

/* ---------- CONTENU ---------- */
main{min-height:60vh;padding-bottom:90px}
.view{animation:viewIn .5s var(--ease) both}
.view.out{animation:viewOut .2s ease-in both}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translateY(-8px)}}
.edhead{padding:22px 2px 6px}
.edhead h1{font:900 clamp(40px,11vw,72px)/.9 "Inter Tight",sans-serif;letter-spacing:-.065em;margin:10px 0 10px}
.edhead h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{color:var(--muted)}
.periode{font:400 15px "Inter Tight",sans-serif;color:var(--muted)}
.chapeau{font:500 clamp(18.5px,4.6vw,22px)/1.42 "Inter Tight",sans-serif;letter-spacing:-.015em;margin:18px 2px 10px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px;font:600 12px "Inter Tight",sans-serif;color:var(--muted);background:var(--card);padding:6px 10px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.rouge{background:var(--lv-rouge)}.dot.orange{background:var(--lv-orange)}.dot.vert{background:var(--lv-vert)}
.day{display:flex;align-items:center;gap:10px;margin:30px 2px 10px;color:var(--muted)}
.day::after{content:"";flex:1;height:1px;background:var(--rule)}
.day,.sechead{scroll-margin-top:200px}

.card{background:var(--card);border-radius:var(--r);padding:18px 18px 16px;margin:0 0 10px;box-shadow:var(--shadow);position:relative}
.card.rouge{box-shadow:inset 0 0 0 2px var(--lv-rouge)}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.in{opacity:1;transform:none}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font:800 11.5px/1 "Inter Tight",sans-serif;text-transform:uppercase;letter-spacing:.06em;
  padding:6px 9px;border-radius:8px;color:#111}
.chip.rouge{background:var(--lv-rouge)}.chip.orange{background:var(--lv-orange)}.chip.vert{background:var(--lv-vert)}
.chip.ghost{background:var(--card2);color:var(--ink)}
.chip.fb{background:#1877f2;color:#fff}.chip.x{background:var(--ink);color:var(--bg)}.chip.ig{background:#d62976;color:#fff}.chip.li{background:#0a66c2;color:#fff}
.chip.rumeur{background:var(--yellow)}.chip.dementi{background:var(--card2);color:var(--ink);text-decoration:line-through}
.time{margin-left:auto;font:500 12.5px "Inter Tight",sans-serif;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.card h3{font:800 clamp(20px,5.2vw,25px)/1.16 "Inter Tight",sans-serif;letter-spacing:-.035em;margin:0 0 10px}
.card p{margin:0 0 11px;hyphens:auto;-webkit-hyphens:auto}
.body{position:relative}
.body.clip{max-height:15.5em;overflow:hidden}
.body.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5em;background:linear-gradient(transparent,var(--card))}
.more{appearance:none;border:0;background:var(--card2);color:var(--ink);font:700 13.5px "Inter Tight",sans-serif;padding:9px 14px;border-radius:999px;cursor:pointer;margin:2px 0 10px;transition:transform .2s var(--ease)}
.more:active{transform:scale(.95)}
.comp{background:var(--card2);border-radius:16px;padding:14px 16px;margin:6px 0 12px;font-size:15.5px;line-height:1.55}
.comp .lbl{display:block;color:var(--muted);margin-bottom:6px}
.src{font:400 12.5px/1.55 Inter,sans-serif;color:var(--muted)}
.src a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.note{margin-top:24px;padding:14px 16px;border:1px dashed var(--rule);border-radius:18px;font-size:14px;color:var(--muted)}
.state{padding:70px 0;text-align:center;color:var(--muted);font:400 17px "Inter Tight",sans-serif}

/* ---------- MATINALE : cartes ---------- */
.modes{display:inline-flex;gap:4px;background:var(--chip);border-radius:999px;padding:4px;margin:14px 0 0}
.modes button{appearance:none;border:0;background:none;color:var(--muted);font:700 13.5px "Inter Tight",sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .3s,color .3s}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.deckwrap{position:relative;margin:14px -16px 0}
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 7% 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.deck::-webkit-scrollbar{display:none}
.mcard{flex:0 0 86%;max-width:520px;scroll-snap-align:center;height:min(64vh,540px);border-radius:28px;padding:20px 20px 18px;display:flex;flex-direction:column;
  position:relative;overflow:hidden;cursor:pointer;color:#141216;transition:transform .45s var(--ease),opacity .45s var(--ease);transform:scale(.93) rotate(-1.2deg);opacity:.7}
.mcard.cur{transform:none;opacity:1}
.mcard.k1{background:var(--c1);color:#fff}.mcard.k2{background:var(--c2);color:#fff}.mcard.k3{background:var(--c3);color:#fff}
.mcard.k4{background:var(--c4)}.mcard.k5{background:var(--c5)}.mcard.k6{background:var(--c6)}
.mcard .top{display:flex;align-items:center;gap:8px}
.mcard .rb{font:800 11px "Inter Tight",sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.14);display:inline-flex;align-items:center;gap:6px}
.mcard .rb .dot{box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.mcard .hr{margin-left:auto;font:700 13px "Inter Tight",sans-serif;opacity:.75;font-variant-numeric:tabular-nums}
.mcard .num{position:absolute;right:16px;bottom:8px;font:900 110px/1 "Inter Tight",sans-serif;letter-spacing:-.08em;opacity:.1;pointer-events:none}
.mcard h3{font:800 clamp(24px,6.6vw,32px)/1.08 "Inter Tight",sans-serif;letter-spacing:-.04em;margin:16px 0 12px}
.mcard .ex{font-size:16.5px;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;flex:1;margin:0;opacity:.92}
.mcard .bot{display:flex;align-items:center;gap:10px;margin-top:14px;position:relative;z-index:2}
.mcard .read{appearance:none;border:0;border-radius:999px;padding:11px 18px;font:800 14px "Inter Tight",sans-serif;background:#141216;color:#fff;cursor:pointer}
.mcard.k4 .read,.mcard.k5 .read,.mcard.k6 .read{background:#141216}
.mcard.k1 .read,.mcard.k2 .read,.mcard.k3 .read{background:#fff;color:#141216}
.mcard .ok{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.14);opacity:0;transform:scale(.4);transition:all .4s var(--ease)}
.mcard .ok svg{width:17px;height:17px}
.mcard.lu .ok{opacity:1;transform:none}
.mcard.endc{background:var(--card);color:var(--ink);align-items:flex-start;justify-content:center;box-shadow:inset 0 0 0 2px var(--rule)}
.mcard.endc h3{font-size:clamp(30px,8vw,40px)}
.mcard.endc em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;width:10px;height:10px;border-radius:3px;opacity:0}
.endc.cur .confetti i{animation:conf 1.6s var(--ease) forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(320deg)}}
.deckctl{display:flex;align-items:center;gap:10px;padding:0 16px}
.deckctl .cnt{font:800 15px "Inter Tight",sans-serif;font-variant-numeric:tabular-nums}
.deckctl .cnt span{color:var(--muted);font-weight:600}
.deckctl .nav{margin-left:auto;display:flex;gap:8px}
.deckctl .nav button{appearance:none;border:0;width:44px;height:44px;border-radius:50%;background:var(--chip);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .2s var(--ease)}
.deckctl .nav button:active{transform:scale(.88)}
.deckctl .nav svg{width:18px;height:18px}
.pips{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px 0}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--chip);transition:all .3s}
.pips i.r{background:var(--lv-rouge)}.pips i.o{background:var(--lv-orange)}.pips i.v{background:var(--lv-vert)}
.pips i{opacity:.35}.pips i.lu{opacity:1}.pips i.cur{transform:scale(1.6);opacity:1}
/* feuille de lecture */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(10,8,12,.5);opacity:0;pointer-events:none;transition:opacity .35s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .in{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(30px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .5s var(--ease);max-width:760px;margin:0 auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet.on .in{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--rule);margin:4px auto 14px}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet .x{margin-left:auto;appearance:none;border:0;width:38px;height:38px;border-radius:50%;background:var(--chip);color:var(--ink);cursor:pointer;font:700 18px/1 sans-serif}
.sheet h2{font:800 clamp(26px,7vw,34px)/1.1 "Inter Tight",sans-serif;letter-spacing:-.04em;margin:0 0 14px}
.sheet p{margin:0 0 13px}
.sheet .nx{appearance:none;border:0;width:100%;margin-top:14px;padding:15px;border-radius:18px;background:var(--grad);color:#fff;font:800 15.5px "Inter Tight",sans-serif;cursor:pointer}
/* Jeu : progression de lecture */
.prog{display:flex;align-items:center;gap:10px;padding:0 0 10px}
.prog .bar{flex:1;height:8px;border-radius:999px;background:var(--card);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--grad);transition:width .6s var(--ease)}
.prog span{font:700 12.5px "Inter Tight",sans-serif;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog.done .bar i{background:var(--lv-vert)}
body.onfil .prog,body.onviala .prog{display:none}
.card .tick{display:none;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;place-items:center;flex:none}
.card .tick svg{width:13px;height:13px}
.card.lu .tick{display:grid;animation:pop .45s var(--ease)}
.card.lu h3{opacity:.78}
.card{transition:transform .2s var(--ease)}
.card:active{transform:scale(.985)}
.hprog{margin-top:12px;height:6px;border-radius:999px;background:var(--card2);overflow:hidden}
.hprog i{display:block;height:100%;width:0;background:var(--lime);border-radius:999px;transition:width .7s var(--ease)}
.hprogt{font:600 12px "Inter Tight",sans-serif;color:var(--muted);margin-top:6px}
/* Fil */
.maj{display:flex;align-items:center;gap:6px;font:500 13px "Inter Tight",sans-serif;color:var(--muted)}
.maj .live{color:var(--lv-rouge)}
.card.dep{padding:15px 16px 13px}
.card.dep h3{font-size:clamp(18px,4.8vw,21px);margin-bottom:7px}
.card.dep p{font-size:16px;margin-bottom:8px}
.card.dep.new{animation:flash 2.4s var(--ease)}
@keyframes flash{0%{background:color-mix(in srgb,var(--red) 30%,var(--card))}100%{background:var(--card)}}

/* Sous-onglets */
.subtabs{display:inline-flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;margin:14px 0 0}
.subtabs button{appearance:none;border:0;background:none;color:var(--muted);font:700 14px "Inter Tight",sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;transition:background .3s,color .3s}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sechead{display:flex;align-items:baseline;gap:10px;margin:30px 2px 10px}
.sechead h2{font:800 clamp(24px,6vw,32px)/1 "Inter Tight",sans-serif;letter-spacing:-.05em;margin:0}
.sechead .n{margin-left:auto;color:var(--muted)}
.synth{font:500 clamp(17px,4.3vw,19.5px)/1.5 "Inter Tight",sans-serif;letter-spacing:-.01em;margin:0}
.go{display:inline-flex;align-items:center;gap:6px;font:700 13px "Inter Tight",sans-serif;text-decoration:none;padding:8px 13px;border-radius:999px;background:var(--card2);transition:transform .2s var(--ease)}
.go:active{transform:scale(.95)}
.react{font-size:14.5px;color:var(--muted)}

/* Viala */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 4px}
.stat{border-radius:20px;padding:14px 12px;min-width:0}
.stat:nth-child(1){background:var(--c4);color:#111}
.stat:nth-child(2){background:var(--c6);color:#111}
.stat:nth-child(3){background:var(--c5);color:#111}
.stat:nth-child(4){background:var(--grad);color:#fff}
.stat .v{font:800 32px/1 "Inter Tight",sans-serif;letter-spacing:-.05em}
.stat .k{font:600 10.5px "Inter Tight",sans-serif;text-transform:uppercase;letter-spacing:.06em;margin-top:6px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tone{font:700 11px "Inter Tight",sans-serif;letter-spacing:.05em;padding:5px 8px;border-radius:8px;text-transform:uppercase;background:var(--card2)}
.tone.fav{color:var(--lv-vert)}.tone.crit{color:var(--lv-rouge)}
.media{font:800 13px "Inter Tight",sans-serif}
.card h4{font:800 19px/1.22 "Inter Tight",sans-serif;letter-spacing:-.03em;margin:0 0 8px}
.card.vig{display:flex;gap:12px;align-items:flex-start}
.card.vig .ex{flex:none;width:30px;height:30px;border-radius:50%;background:var(--lv-orange);color:#111;display:grid;place-items:center;font:900 15px "Inter Tight",sans-serif}
.card.vig p{margin:3px 0 0;font-size:16px}

footer{padding:24px 0 50px;color:var(--muted);font:400 13px "Inter Tight",sans-serif;text-align:center}
.totop{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;width:50px;height:50px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);
  cursor:pointer;opacity:0;transform:translateY(20px) scale(.8);transition:opacity .35s,transform .35s var(--ease);pointer-events:none}
.totop.on{opacity:1;transform:none;pointer-events:auto}
.totop svg{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,160%);display:flex;gap:12px;align-items:center;
  background:var(--ink);color:var(--bg);border-radius:22px;padding:10px 10px 10px 18px;font:600 15px "Inter Tight",sans-serif;transition:transform .55s var(--ease);
  width:calc(100vw - 28px);max-width:440px}
.toast #toastTxt{flex:1}
.toast.on{transform:translate(-50%,0)}
.toast button{appearance:none;border:0;border-radius:16px;padding:10px 14px;background:var(--grad);color:#fff;font:800 14px "Inter Tight",sans-serif;cursor:pointer;flex:none}
.toast .tdot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;animation:pulse 1.4s infinite}

/* ---------- VERROU ---------- */
body.locked{overflow:hidden}
body.locked .hero,body.locked .sticky,body.locked main,body.locked footer{visibility:hidden}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(26px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));overflow:hidden;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.lock.gone{opacity:0;transform:translateY(-3%);pointer-events:none}
.lock .head{width:100%;max-width:360px;position:relative;z-index:2}
.lock .big{font:900 clamp(56px,17vw,92px)/.82 "Inter Tight",sans-serif;letter-spacing:-.07em;margin:6px 0 0}
.lock .big em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lock .sub{font:300 13px "Inter Tight",sans-serif;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:14px}
.lock .orb{position:absolute;border-radius:50%;opacity:.9;z-index:0;pointer-events:none}
.lock .o1{width:240px;height:240px;right:-80px;top:-60px;background:radial-gradient(circle at 30% 30%,var(--g3),var(--g2) 60%,transparent 70%);animation:float 9s ease-in-out infinite}
.lock .o2{width:200px;height:200px;left:-80px;bottom:-60px;background:radial-gradient(circle at 60% 40%,var(--g1),var(--g2) 60%,transparent 70%);animation:float 11s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(-14px,18px)}}
.lock > div{position:relative;z-index:2}
.dots{display:flex;gap:16px;justify-content:center;margin:22px 0 6px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--muted);transition:background .2s,border-color .2s,transform .25s var(--ease)}
.dots i.on{background:var(--g2);border-color:var(--g2);transform:scale(1.15)}
.dots.ok i{background:var(--lv-vert);border-color:var(--lv-vert)}
.lock .err{min-height:20px;text-align:center;font:600 13.5px "Inter Tight",sans-serif;color:var(--lv-rouge)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center}
.pad button{appearance:none;border:0;width:76px;height:76px;border-radius:50%;background:var(--card);color:var(--ink);font:500 30px "Inter Tight",sans-serif;
  cursor:pointer;transition:transform .15s var(--ease),background .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pad button:active{transform:scale(.9);background:var(--card2)}
.pad button.ghost{background:none;font-size:15px;font-weight:600;color:var(--muted)}
.pad button.ghost svg{width:26px;height:26px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.lock .foot{font:500 12px "Inter Tight",sans-serif;color:var(--muted);text-align:center}

@media (min-width:700px){
  .bento{grid-template-columns:1fr 1fr 2fr}
  .wide{grid-column:span 1}
  .bento .t-blue{grid-column:span 3}
}
@media (max-height:700px){ .pad{grid-template-columns:repeat(3,66px);gap:10px 20px} .pad button{width:66px;height:66px;font-size:26px} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal,.tile{opacity:1;transform:none}
  .mast h1 .l span,.shape{transform:none;opacity:1}
}
</style>
</head>

<script>
(function(){
  var $=function(id){ return document.getElementById(id); };
  var esc=function(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };
  var MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  var JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  var SLOTS={"06":"6 h","10":"10 h","12":"12 h","1430":"14 h 30","17":"17 h","18":"18 h","1930":"19 h 30","20":"20 h","21":"21 h","2130":"21 h 30","23":"23 h"};
  var RANK={rouge:0,orange:1,vert:2}, NIV={rouge:"Majeur",orange:"Important",vert:"À savoir"};
  function parts(iso){ var p=iso.split("-"); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); }
  function fmtDate(iso){ var d=parts(iso), j=d.getUTCDate(); return JOURS[d.getUTCDay()]+" "+(j===1?"1er":j)+" "+MOIS[d.getUTCMonth()]+" "+d.getUTCFullYear(); }
  function shortDay(iso){ var d=parts(iso), j=d.getUTCDate(); return (j===1?"1er":j)+" "+MOIS[d.getUTCMonth()]; }
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
  function hhmm(iso){ var m=String(iso||"").match(/T(\d\d):(\d\d)/); return m? m[1]+":"+m[2] : ""; }
  function lvl(n){ return RANK[n]!=null?n:"vert"; }
  function rk(n){ return RANK[n]!=null?RANK[n]:2; }

  /* ---- thème ---- */
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  function setTheme(t){ document.documentElement.setAttribute("data-theme",t); $("themeBtn").innerHTML=t==="dark"?SUN:MOON;
    var m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=t==="dark"?"#121014":"#f4f1ea"; try{localStorage.setItem("revue-theme",t);}catch(e){} }
  function toggleTheme(){ setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"); }
  var saved=null; try{saved=localStorage.getItem("revue-theme");}catch(e){}
  setTheme(saved || (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light":"dark"));
  $("themeBtn").addEventListener("click",toggleTheme);

  /* ---- état ---- */
  var editions=[], current=null, data=null, tab="general", cache={}, fil=null, filSeen={}, avSub="presse", openArt={};
  var TABS=["general","fil","aveyron","viala"];
  var LUS={}, total=[], doneShown={};
  try{ LUS=JSON.parse(localStorage.getItem("revue-lus")||"{}")||{}; }catch(e){ LUS={}; }
  function akey(a){ return (current?current.date:"")+"|"+String(a.titre||"").slice(0,90); }
  function saveLus(){ try{ var k=Object.keys(LUS); if(k.length>3000){ k.slice(0,k.length-3000).forEach(function(x){ delete LUS[x]; }); } localStorage.setItem("revue-lus",JSON.stringify(LUS)); }catch(e){} }
  function progress(){
    var n=total.length, r=total.filter(function(k){ return LUS[k]; }).length, pc=n?Math.round(r*100/n):0;
    $("progBar").style.width=pc+"%"; $("progTxt").textContent=r+" / "+n+" lus";
    $("prog").classList.toggle("done", n>0 && r===n);
    if(tab==="general"){ $("hProg").style.width=pc+"%"; $("hProgT").textContent=r?(r===n?"Journal terminé":r+" article"+(r>1?"s":"")+" lu"+(r>1?"s":"")+" sur "+n):"Rien lu pour l'instant"; }
    var dk=tab+"|"+(current&&current.id);
    if(n && r===n && !doneShown[dk] && !pending){ doneShown[dk]=1; $("toastTxt").textContent=(tab==="general"?"Journal":"Rubrique Aveyron")+" terminé, "+n+" sur "+n; $("toast").dataset.fil=""; $("toast").classList.add("on"); setTimeout(function(){ $("toast").classList.remove("on"); },3200); }
  }
  function markRead(el){ var k=el.getAttribute("data-key"); if(!k||LUS[k]) return; LUS[k]=1; el.classList.add("lu"); var i=el.getAttribute("data-i"); if(i!=null && $("pips") && $("pips").children[+i]) $("pips").children[+i].classList.add("lu"); saveLus(); progress(); }
  var timers=new WeakMap();
  var readIO=("IntersectionObserver" in window)? new IntersectionObserver(function(es){
    es.forEach(function(e){ var el=e.target;
      if(e.isIntersecting && e.intersectionRatio>=0.55){ if(!timers.get(el)) timers.set(el,setTimeout(function(){ markRead(el); },2200)); }
      else { clearTimeout(timers.get(el)); timers.delete(el); }
      // longue carte : lue quand son bas a été atteint
      if(!e.isIntersecting && e.boundingClientRect.bottom<=0 && e.rootBounds) markRead(el);
    });
  },{threshold:[0,0.55,1]}) : null;

  /* ---- chiffrement ---- */
  var CODE=null, keyCache={};
  function b64(s){ var bin=atob(s), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
  function deriveKey(code, salt, iter){
    var k=code+"|"+salt; if(keyCache[k]) return keyCache[k];
    keyCache[k]=crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(salt),iterations:iter||200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    });
    return keyCache[k];
  }
  function decrypt(j, code){
    if(!j || !j.enc) return Promise.resolve(j);
    return deriveKey(code, j.salt, j.iter).then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(j.iv)},key,b64(j.data)); })
      .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
  }
  var EMBED=null; try{ EMBED=JSON.parse(document.getElementById("embed").textContent||"null"); }catch(e){}
  function raw(url){
    var fromEmbed=function(err){ if(EMBED && EMBED[url]) return EMBED[url]; throw err||new Error("absent"); };
    try{ return fetch(url+(url.indexOf("?")<0?"?":"&")+"t="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).catch(fromEmbed); }
    catch(e){ return Promise.resolve().then(function(){ return fromEmbed(e); }); }
  }
  function load(url){
    if(cache[url]) return Promise.resolve(cache[url]);
    return raw(url).then(function(j){ return decrypt(j, CODE).then(function(d){ cache[url]=d; return d; }); });
  }
  function okey(e){ var s=String(e.slot||""); return e.date+"-"+("0000"+(s.length<3?s+"00":s)).slice(-4); }
  function dates(){ var s={},o=[]; editions.forEach(function(e){ if(!s[e.date]){s[e.date]=1;o.push(e.date);} }); return o.sort().reverse(); }
  function fillDates(){ $("dateSel").innerHTML=dates().map(function(d){ return '<option value="'+d+'">'+esc(cap(fmtDate(d)))+'</option>'; }).join(""); }

  /* ---- accueil ---- */
  function countUp(el, to){
    var from=+el.textContent||0; if(from===to){ el.textContent=to; return; }
    var t0=null; function step(t){ if(!t0) t0=t; var p=Math.min(1,(t-t0)/700), e=1-Math.pow(1-p,3); el.textContent=Math.round(from+(to-from)*e); if(p<1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }
  function heroStats(){
    if(current){ var d=parts(current.date);
      $("hDay").textContent=JOURS[d.getUTCDay()]+" · 8 journaux par jour";
      $("hDate").textContent=("0"+d.getUTCDate()).slice(-2)+"/"+("0"+(d.getUTCMonth()+1)).slice(-2);
      $("hSlot").textContent=SLOTS[current.slot]||current.slot; }
    if(data){ var n={rouge:0,orange:0,vert:0};
      (data.sections||[]).forEach(function(s){ (s.articles||[]).forEach(function(a){ n[lvl(a.niveau)]++; }); });
      countUp($("nR"),n.rouge); countUp($("nO"),n.orange); countUp($("nV"),n.vert); }
    if(fil){ var it=fil.items||[]; countUp($("nF"),it.length);
      $("hFilMaj").textContent=fil.maj?"Fil · "+hhmm(fil.maj):"Fil info"; }
  }
  function goTab(t){ var b=document.querySelector('button[data-tab="'+t+'"]'); if(t===tab){ scrollToNav(); } else b.click(); }
  Array.prototype.forEach.call(document.querySelectorAll(".mini"),function(b){ b.addEventListener("click",function(){ goTab(b.getAttribute("data-go")); }); });
  (function(){ var g=$("petals"), h=""; for(var i=0;i<10;i++){ h+='<path transform="rotate('+(i*36)+')" d="M-9 -12 C-9 -40 -14 -70 0 -86 C14 -70 9 -40 9 -12 Z" opacity="'+(0.55+0.45*(i%2))+'"/>'; } g.innerHTML=h; })();

  function syncControls(){
    $("dateSel").value=current.date;
    var avail={}; editions.forEach(function(e){ if(e.date===current.date) avail[e.slot]=1; });
    var std=["06","10","12","1430","17","1930","21","23"], list=std.slice();
    Object.keys(avail).forEach(function(k){ if(list.indexOf(k)<0) list.push(k); });
    list.sort(function(a,b){ return (a.length<3?+a*100:+a)-(b.length<3?+b*100:+b); });
    $("slots").innerHTML=list.map(function(k){ return '<button class="slot" data-slot="'+k+'">'+esc(SLOTS[k]||k)+'</button>'; }).join("");
    Array.prototype.forEach.call(document.querySelectorAll(".slot"),function(b){ var s=b.getAttribute("data-slot"); b.disabled=!avail[s]; b.setAttribute("aria-pressed", s===current.slot?"true":"false"); });
    var i=TABS.indexOf(tab);
    $("tabs").classList.toggle("off", i>1);
    if(i<=1) $("ind").style.transform="translateX("+(i*100)+"%)";
    Array.prototype.forEach.call(document.querySelectorAll("button[data-tab]"),function(b){ b.setAttribute("aria-selected", b.getAttribute("data-tab")===tab?"true":"false"); });
    heroStats();
  }

  /* ---- rendu ---- */
  function sources(list){
    if(!list||!list.length) return "";
    return '<div class="src">Sources : '+list.map(function(s){ return s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.nom)+'</a>':esc(s.nom); }).join(" · ")+'</div>';
  }
  function legend(){ return '<div class="legend"><span><i class="dot rouge"></i>Majeur</span><span><i class="dot orange"></i>Important</span><span><i class="dot vert"></i>À savoir</span></div>'; }
  function head(kicker, titleHTML, extra){ return '<div class="edhead"><div class="kicker lbl">'+esc(kicker)+'</div><h1>'+titleHTML+'</h1>'+(extra||"")+'</div>'; }

  function wireDeck(){

      Array.prototype.forEach.call(d.children,function(el,i){ var m=el.offsetLeft+el.offsetWidth/2, dd=Math.abs(m-c); if(dd<bd){bd=dd;best=i;} });
      if(best===deckIdx && d.children[best].classList.contains("cur")) return;
      Array.prototype.forEach.call(d.children,function(el,i){ el.classList.toggle("cur",i===best); });
      // la carte quittée vers l'avant compte comme lue
      if(best>deckIdx){ for(var k=deckIdx;k<best;k++){ var el=d.children[k]; if(el && el.hasAttribute("data-key")) markRead(el); } }
      deckIdx=best; var n=deckItems.length;

      Array.prototype.forEach.call($("pips").children,function(p,i){ p.classList.toggle("cur",i===best); });
      clearTimeout(deckTimer); var el=d.children[best];

    }
    var raf=false; d.addEventListener("scroll",function(){ if(!raf){ raf=true; requestAnimationFrame(function(){ raf=false; upd(); }); } },{passive:true});
    d.children[0] && d.children[0].classList.add("cur"); setTimeout(upd,50);

  }

  $("dateSel").addEventListener("change",function(){ var d=this.value, l=editions.filter(function(e){return e.date===d;}).sort(function(a,b){return okey(a)<okey(b)?1:-1;}); if(l[0]) show(l[0]); });
  $("slots").addEventListener("click",function(ev){ var b=ev.target.closest(".slot"); if(!b||b.disabled) return; var s=b.getAttribute("data-slot"); var e=editions.filter(function(x){return x.date===current.date&&x.slot===s;})[0]; if(e) show(e); });
  Array.prototype.forEach.call(document.querySelectorAll("button[data-tab]"),function(b){
    b.addEventListener("click",function(){ var t=b.getAttribute("data-tab"); if(t===tab) return; tab=t; if(t==="fil") $("filBadge").hidden=true; syncControls(); paint(); writeHash(); scrollToNav(); });
  });

  /* balayage entre onglets */
  var sx=null, sy=null;
  $("view").addEventListener("touchstart",function(e){ if(e.target.closest && e.target.closest(".deck")){ sx=null; return; } sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
  $("view").addEventListener("touchend",function(e){
    if(sx===null) return; var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.8){ var i=TABS.indexOf(tab)+(dx<0?1:-1); if(i>=0&&i<TABS.length) document.querySelector('button[data-tab="'+TABS[i]+'"]').click(); }
  },{passive:true});

  function spy(){
    var links=$("toc").querySelectorAll("a"), on=null;
    Array.prototype.forEach.call(links,function(a){ var el=document.getElementById(a.getAttribute("data-target")); if(el && el.getBoundingClientRect().top<230) on=a; });
    Array.prototype.forEach.call(links,function(a){ a.classList.toggle("on",a===on); });
    if(on && on.dataset.shown!=="1"){ Array.prototype.forEach.call(links,function(a){a.dataset.shown="";}); on.dataset.shown="1"; $("toc").scrollTo({left:on.offsetLeft-16,behavior:"smooth"}); }
    $("totop").classList.toggle("on", window.scrollY>900);
  }
  var tick=false; window.addEventListener("scroll",function(){ if(!tick){ tick=true; requestAnimationFrame(function(){ spy(); tick=false; }); } },{passive:true});
  $("totop").addEventListener("click",function(){ window.scrollTo({top:0,behavior:"smooth"}); });

  /* ---- fil ---- */
  function refreshFil(silent){
    if(!CODE) return Promise.resolve();
    return raw("fil.json").then(function(j){ return decrypt(j, CODE); }).then(function(d){
      var before=fil&&fil.maj, fresh=0;
      (d.items||[]).forEach(function(x){ if(!filSeen[x.heure+"|"+x.titre]) fresh++; });
      fil=d; heroStats();
      if(silent && before && d.maj!==before && fresh){
        if(tab==="fil") paint(); else { var b=$("filBadge"); b.hidden=false; b.textContent=fresh; }
        var red=(d.items||[]).some(function(x){ return x.niveau==="rouge" && !filSeen[x.heure+"|"+x.titre]; });
        $("toastTxt").textContent=(red?"Alerte : ":"")+fresh+(fresh>1?" nouvelles dépêches":" nouvelle dépêche");
        pending=null; $("toast").classList.add("on"); $("toast").dataset.fil="1";
        try{ if(red && navigator.vibrate) navigator.vibrate([60,60,60]); }catch(e){}
      } else if(!silent && tab==="fil") paint();
    }).catch(function(){ if(!fil){ fil={items:[]}; if(tab==="fil") paint(); } });
  }

  /* ---- verrou : code à 4 chiffres ---- */
  var entry="", busy=false, LEN=4;
  function drawDots(){ Array.prototype.forEach.call($("dots").children,function(d,i){ d.classList.toggle("on",i<entry.length); }); }
  function tryCode(code){
    return raw("editions/index.json").then(function(idx){
      var list=(idx.editions||[]).slice().sort(function(a,b){return okey(a)<okey(b)?1:-1;});
      if(!list.length) return raw("fil.json").then(function(j){ return decrypt(j, code); }).then(function(){ return idx; });
      return raw(list[0].file).then(function(j){ return decrypt(j, code); }).then(function(d){ cache[list[0].file]=d; return idx; });
    });
  }
  function start(idx){
    editions=(idx.editions||[]).slice().sort(function(a,b){return okey(a)<okey(b)?1:-1;});
    known={}; editions.forEach(function(e){known[e.id]=1;});
    refreshFil(false).then(function(){
      if(!editions.length){ $("view").innerHTML='<div class="state">Aucune édition pour l\'instant.</div>'; return; }
      var e0=fromHash()||editions[0]; fillDates(); show(e0, true);
    });
  }
  var polling=false;
  function unlock(code, quiet){
    return tryCode(code).then(function(idx){
      CODE=code; try{ sessionStorage.setItem("revue-s", code); }catch(e){}
      setTimeout(function(){ $("lock").classList.add("gone"); document.body.classList.remove("locked"); start(idx); if(!polling){ polling=true; poll(); } }, quiet?0:380);
    });
  }
  function press(k){
    if(busy) return;
    if(k==="theme"){ toggleTheme(); return; }
    if(k==="del"){ entry=entry.slice(0,-1); drawDots(); $("err").textContent=""; return; }
    if(!/^\d$/.test(k) || entry.length>=LEN) return;
    entry+=k; drawDots(); $("err").textContent="";
    try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
    if(entry.length<LEN) return;
    busy=true;
    unlock(entry).then(function(){ $("dots").classList.add("ok"); }).catch(function(){
      $("err").textContent="Code incorrect";
      try{ if(navigator.vibrate) navigator.vibrate([40,40,40]); }catch(e){}
      var d=$("dots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
      setTimeout(function(){ entry=""; drawDots(); busy=false; },450);
    });
  }
  $("pad").addEventListener("click",function(e){ var b=e.target.closest("button"); if(b) press(b.getAttribute("data-k")); });
  document.addEventListener("keydown",function(e){
    if(!document.body.classList.contains("locked")) return;
    if(/^\d$/.test(e.key)) press(e.key); else if(e.key==="Backspace") press("del");
  });
  $("lockBtn").addEventListener("click",function(){
    CODE=null; cache={}; keyCache={}; fil=null; data=null; entry=""; busy=false; drawDots(); $("err").textContent=""; $("dots").classList.remove("ok");
    try{ sessionStorage.removeItem("revue-s"); }catch(e){}
    $("view").innerHTML=""; document.body.classList.add("locked"); $("lock").classList.remove("gone");
  });
  try{ localStorage.removeItem("revue-code"); }catch(e){}
  (function(){ var s=null; try{ s=sessionStorage.getItem("revue-s"); }catch(e){} if(s) unlock(s,true).catch(function(){ try{sessionStorage.removeItem("revue-s");}catch(e){} }); })();

  /* ---- nouvelles éditions ---- */
  var known={}, pending=null, baseTitle=document.title;
  function notify(e){
    pending=e; $("toast").dataset.fil="";
    $("toastTxt").textContent="Nouvelle édition de "+(SLOTS[e.slot]||e.slot)+" disponible";
    $("toast").classList.add("on"); document.title="(1) "+baseTitle;
    try{ if(window.Notification && Notification.permission==="granted") new Notification("La Revue",{body:"L'édition de "+(SLOTS[e.slot]||e.slot)+" est prête.",icon:"icons/apple-touch-icon.png"}); }catch(_){}
  }
  $("toastGo").addEventListener("click",function(){
    $("toast").classList.remove("on"); document.title=baseTitle;
    if($("toast").dataset.fil==="1"){ $("toast").dataset.fil=""; if(tab!=="fil") goTab("fil"); else paint(); return; }
    if(pending){ fillDates(); show(pending); pending=null; }
  });
  function poll(){
    setInterval(function(){
      if(!CODE) return;
      raw("editions/index.json").then(function(idx){
        var list=(idx.editions||[]).slice().sort(function(a,b){return okey(a)<okey(b)?1:-1;}), fresh=null;
        list.forEach(function(e){ if(!known[e.id]){ known[e.id]=1; if(!fresh) fresh=e; } });
        editions=list; if(fresh) notify(fresh);
      }).catch(function(){});
      refreshFil(true);
    }, 90000);
  }
})();
</script>
</body>
</html>
